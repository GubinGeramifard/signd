name: Supabase keep-alive

# Supabase pauses free projects after 7 days of inactivity. This runs a tiny
# query every 2 days to reset that timer so the SignD demo stays online.
# (Note: GitHub disables scheduled workflows after 60 days with no commits to
# the repo, so push something occasionally, or re-enable it from the Actions tab.)

on:
  schedule:
    - cron: "0 7 */2 * *" # every 2 days at 07:00 UTC
  workflow_dispatch: {} # allow manual runs from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Query the database to keep it active
        run: |
          # Calls public.keep_alive(), a trivial SQL function (returns now())
          # that the anon role may execute. This runs a real query against
          # Postgres (which resets the inactivity timer) while exposing no data.
          # The old version queried the documents table, which the anon role
          # cannot read, so it returned 401 and never counted as activity.
          code=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Content-Type: application/json" \
            "${{ secrets.SUPABASE_URL }}/rest/v1/rpc/keep_alive")
          echo "Supabase responded: HTTP $code"
          # ONLY a 2xx means PostgREST actually ran a query against Postgres,
          # which is what resets Supabase's inactivity timer. A 401/403 is
          # rejected at the auth layer BEFORE touching the database, so it does
          # NOT count as activity and must be treated as a failure (this is the
          # bug that let the project pause on 2026-10-11 despite "successful" runs).
          if [ "$code" -ge 200 ] && [ "$code" -lt 300 ]; then
            echo "Keep-alive OK (database was queried)."
          else
            echo "Keep-alive FAILED: expected 2xx, got $code."
            echo "A 401/403 means SUPABASE_ANON_KEY is wrong or stale (did the project keys rotate on restore?)."
            echo "A 5xx/000 means the project is paused or unreachable."
            exit 1
          fi
