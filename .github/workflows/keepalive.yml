name: Supabase keep-alive

# Supabase pauses free projects after 7 days of inactivity. This runs a tiny
# query every 2 days to reset that timer so the SignD demo stays online.
# (Note: GitHub disables scheduled workflows after 60 days with no commits to
# the repo, so push something occasionally, or re-enable it from the Actions tab.)

on:
  schedule:
    - cron: "0 7 */2 * *" # every 2 days at 07:00 UTC
  workflow_dispatch: {} # allow manual runs from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Query the database to keep it active
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
            "${{ secrets.SUPABASE_URL }}/rest/v1/documents?select=id&limit=1")
          echo "Supabase responded: HTTP $code"
          # Any response from PostgREST (2xx/4xx) means the database was reached.
          # Only a server error or no-connection means the ping failed.
          if [ "$code" = "000" ] || [ "$code" -ge 500 ]; then
            echo "Keep-alive failed (project may be paused or down)."
            exit 1
          fi
          echo "Keep-alive OK."
